name: Claude Code Review

# Manual trigger only: comment "@claude review" on a pull request.
# Because this reacts to issue_comment, GitHub always runs the copy of this
# file on the default branch — edits only take effect once merged to main.
on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Only on pull requests, and only when the comment starts with the phrase.
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # issue_comment checks out the default branch, so move to the PR head
      # to give the reviewer the code as it actually stands on the branch.
      - name: Check out the pull request head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }}

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}"
          # The action only starts the inline-comment MCP server when
          # --allowedTools names it, even though the skill also declares it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
